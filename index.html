:root {
  --navy: #00205b;
  --navy-2: #061a3b;
  --teal: #007b85;
  --teal-dark: #00606a;
  --green: #70ad47;
  --yellow: #ffb600;
  --ink: #18304b;
  --text: #475569;
  --muted: #64748b;
  --line: #dbe6ec;
  --surface: #ffffff;
  --background: #f8fafc;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--text);
  background: var(--background);
  font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, a { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }

.top-line {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 80;
  height: 4px;
  background: linear-gradient(90deg, var(--navy), var(--teal), var(--green), var(--yellow));
}
.section-shell, .site-header { width: min(1180px, calc(100% - 40px)); margin-inline: auto; }
.site-header {
  height: 84px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(0, 32, 91, 0.08);
}
.brand { display: inline-flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  color: white;
  font-weight: 800;
  letter-spacing: -0.04em;
  background: linear-gradient(145deg, var(--navy), var(--teal));
  box-shadow: 0 9px 24px rgba(0, 123, 133, 0.22);
}
.brand strong, .brand small { display: block; }
.brand strong { color: var(--navy); font-size: 0.98rem; }
.brand small { margin-top: 1px; color: var(--muted); font-size: 0.69rem; letter-spacing: 0.025em; }
.header-link { color: var(--teal-dark); font-size: 0.88rem; font-weight: 700; }

.hero {
  min-height: 660px;
  display: grid;
  grid-template-columns: 1.18fr 0.82fr;
  align-items: center;
  gap: clamp(48px, 7vw, 96px);
  padding-block: 70px 92px;
  position: relative;
}
.hero::before {
  content: "";
  position: absolute;
  width: 640px;
  height: 500px;
  top: 8%;
  left: -32%;
  pointer-events: none;
  background-image: linear-gradient(rgba(0,123,133,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,123,133,.05) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(circle at center, black, transparent 72%);
}
.hero-copy, .hero-card { position: relative; z-index: 1; }
.eyebrow, .section-kicker {
  color: var(--teal-dark);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border: 1px solid rgba(0, 123, 133, 0.16);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.82);
}
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(112, 173, 71, 0.14); }
.hero h1 {
  max-width: 730px;
  margin: 24px 0 20px;
  color: var(--navy-2);
  font-size: clamp(3.15rem, 6.5vw, 5.5rem);
  line-height: 0.98;
  letter-spacing: -0.055em;
  font-weight: 800;
}
.hero h1 span { color: var(--teal); }
.hero-lead { max-width: 660px; margin: 0; font-size: clamp(1.05rem, 1.4vw, 1.22rem); line-height: 1.7; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.button {
  min-height: 50px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 22px;
  border-radius: 14px;
  font-size: 0.93rem;
  font-weight: 700;
  transition: 180ms ease;
}
.button:hover { transform: translateY(-2px); }
.button.primary { color: white; background: var(--teal); box-shadow: 0 14px 30px rgba(0, 123, 133, 0.22); }
.button.secondary { color: var(--navy); border: 1px solid var(--line); background: white; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 30px; color: var(--muted); font-size: 0.78rem; font-weight: 600; }
.hero-meta span::before { content: "✓"; margin-right: 6px; color: var(--green); font-weight: 800; }
.hero-card {
  min-height: 430px;
  padding: 42px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
  color: white;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 34px;
  background: radial-gradient(circle at 87% 8%, rgba(112,173,71,.26), transparent 30%), linear-gradient(145deg, var(--navy-2), var(--navy) 55%, #004a73);
  box-shadow: 0 30px 80px rgba(0, 32, 91, 0.2);
}
.orbit { position: absolute; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 50%; }
.orbit-one { width: 250px; height: 250px; top: -85px; right: -75px; }
.orbit-two { width: 155px; height: 155px; top: -37px; right: -29px; }
.hero-card-label { width: fit-content; padding: 7px 10px; color: #b9f3e7; border-radius: 8px; background: rgba(0, 123, 133, 0.28); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
.hero-card blockquote { margin: 24px 0; font-size: clamp(1.55rem, 2.4vw, 2.15rem); line-height: 1.25; letter-spacing: -0.025em; font-weight: 700; }
.source-chip { color: rgba(255,255,255,.66); font-size: 0.77rem; }
.mini-process { display: flex; align-items: center; margin-top: 42px; }
.mini-process span { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border: 1px solid rgba(255,255,255,.18); border-radius: 10px; background: rgba(255,255,255,.08); font-size: .72rem; font-weight: 800; }
.mini-process i { height: 1px; flex: 1; background: rgba(255,255,255,.18); }

.concept-section { padding-block: 110px; background: white; }
.concept-grid { display: grid; grid-template-columns: 0.62fr 1.38fr; gap: 72px; align-items: start; }
h2 { margin: 12px 0 0; color: var(--navy-2); font-size: clamp(2.15rem, 4vw, 3.6rem); line-height: 1.05; letter-spacing: -0.045em; font-weight: 800; }
.definition-card { padding-left: 34px; border-left: 4px solid var(--teal); }
.definition { margin: 0; color: #233d57; font-size: clamp(1.25rem, 2vw, 1.7rem); line-height: 1.56; }
.definition strong { color: var(--teal-dark); }
.adaptation-note { margin: 18px 0 0; color: var(--muted); font-size: 0.78rem; }
.distinctions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 72px; }
.distinctions article { min-height: 312px; padding: 28px; border: 1px solid var(--line); border-radius: 24px; background: var(--surface); box-shadow: 0 10px 34px rgba(29, 63, 90, 0.05); transition: 180ms ease; }
.distinctions article:hover { transform: translateY(-4px); border-color: rgba(0, 123, 133, 0.35); box-shadow: 0 18px 44px rgba(0, 123, 133, 0.11); }
.article-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; color: var(--teal-dark); background: rgba(0, 123, 133, 0.1); font-size: 0.72rem; font-weight: 800; }
.distinctions h3 { margin: 22px 0 10px; color: var(--navy); font-size: 1.15rem; }
.distinctions p { min-height: 84px; margin: 0 0 20px; line-height: 1.62; font-size: 0.92rem; }
.distinctions strong, .distinctions em { display: block; }
.distinctions strong { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; }
.distinctions em { margin-top: 5px; color: var(--ink); font-size: 0.9rem; font-style: normal; font-weight: 600; }
.callout { margin-top: 28px; display: flex; align-items: center; gap: 18px; padding: 22px 26px; border-radius: 18px; color: #345069; background: #eff8f7; }
.callout-mark { width: 36px; height: 36px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; color: white; background: var(--teal); font-weight: 800; }
.callout p { margin: 0; line-height: 1.55; font-size: 0.91rem; }

.moves-section { padding-block: 110px; color: rgba(255,255,255,.72); background: var(--navy-2); }
.section-heading-row { display: flex; align-items: end; justify-content: space-between; gap: 40px; margin-bottom: 42px; }
.section-kicker.light { color: #69d3ca; }
.moves-section h2 { color: white; }
.section-heading-row > div:first-child > p:last-child { max-width: 670px; margin: 18px 0 0; line-height: 1.65; }
.progress-dial { --progress: 0deg; width: 104px; height: 104px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--green) var(--progress), rgba(255,255,255,.1) 0); }
.progress-dial > div { width: 84px; height: 84px; display: grid; place-content: center; text-align: center; border-radius: 50%; background: var(--navy-2); }
.progress-dial strong, .progress-dial span { display: block; }
.progress-dial strong { color: white; font-size: 1.28rem; }
.progress-dial span { margin-top: 1px; font-size: .66rem; }
.moves-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.move-card { border: 1px solid rgba(255,255,255,.1); border-radius: 22px; background: rgba(255,255,255,.04); overflow: hidden; transition: 180ms ease; }
.move-card.open { border-color: rgba(105,211,202,.35); background: rgba(255,255,255,.07); }
.move-main { width: 100%; min-height: 126px; display: grid; grid-template-columns: 54px 1fr 34px; gap: 16px; align-items: center; padding: 24px; color: inherit; text-align: left; border: 0; background: transparent; }
.move-number { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; color: #87eee2; background: rgba(0,123,133,.22); font-size: .72rem; font-weight: 800; }
.move-card.green .move-number { color: #c8f2a8; background: rgba(112,173,71,.2); }
.move-card.yellow .move-number { color: #ffe199; background: rgba(255,182,0,.16); }
.move-card.blue .move-number { color: #bcd7ff; background: rgba(60,123,209,.2); }
.move-copy strong, .move-copy small { display: block; }
.move-copy strong { color: white; font-size: 1.08rem; }
.move-copy small { margin-top: 7px; line-height: 1.45; font-size: .82rem; }
.expand-icon { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; color: white; font-size: 1.15rem; }
.move-detail { padding: 0 24px 24px 94px; }
.move-detail p { margin: 0 0 18px; line-height: 1.65; font-size: .88rem; }
.complete-button { display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; color: white; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; background: rgba(255,255,255,.06); font-size: .76rem; font-weight: 700; }
.complete-button.done { color: #c8f2a8; border-color: rgba(112,173,71,.3); background: rgba(112,173,71,.13); }
.placeholder-section { padding-block: 110px; }
.placeholder-section p:last-child { max-width: 680px; line-height: 1.65; }

.agents-section { padding-block: 110px; background: #f4f8fa; }
.split-heading { display: grid; grid-template-columns: 1.05fr .95fr; align-items: end; gap: 80px; }
.split-heading > p { margin: 0 0 4px; line-height: 1.7; font-size: 1rem; }
.agent-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 50px; }
.agent-card { min-height: 285px; padding: 25px; border: 1px solid var(--line); border-radius: 22px; background: white; box-shadow: 0 10px 30px rgba(29,63,90,.04); }
.agent-code { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; color: white; background: var(--teal); font-size: 1rem; font-weight: 800; }
.agent-card.chemical .agent-code { background: var(--navy); }
.agent-card.biological .agent-code { background: var(--green); }
.agent-card.expanded .agent-code { color: var(--navy); background: var(--yellow); }
.agent-card h3 { margin: 22px 0 9px; color: var(--navy); font-size: 1.08rem; }
.agent-card > p { min-height: 62px; margin: 0; line-height: 1.55; font-size: .86rem; }
.agent-card > div { margin-top: 22px; padding-top: 17px; border-top: 1px solid var(--line); color: var(--ink); font-size: .8rem; line-height: 1.5; }
.agent-card > div strong { display: block; margin-bottom: 5px; color: var(--muted); font-size: .65rem; letter-spacing: .09em; text-transform: uppercase; }
.exposure-chain { display: grid; grid-template-columns: 1fr 30px 1fr 30px 1fr 30px 1fr; align-items: center; gap: 8px; margin-top: 26px; padding: 24px; border: 1px solid rgba(0,123,133,.15); border-radius: 22px; background: linear-gradient(90deg, rgba(0,123,133,.05), rgba(112,173,71,.06)); }
.exposure-chain div { padding: 10px; }
.exposure-chain small, .exposure-chain strong, .exposure-chain span { display: block; }
.exposure-chain small { color: var(--teal); font-size: .62rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.exposure-chain strong { margin-top: 4px; color: var(--navy); font-size: 1rem; }
.exposure-chain span { margin-top: 4px; color: var(--muted); font-size: .73rem; }
.exposure-chain i { color: var(--teal); text-align: center; font-size: 1.2rem; font-style: normal; }

.diagnostic-section { padding-block: 110px; color: rgba(255,255,255,.75); background: linear-gradient(135deg, #003e55, var(--teal-dark)); }
.diagnostic-layout { display: grid; grid-template-columns: .68fr 1.32fr; gap: clamp(44px, 7vw, 90px); align-items: start; }
.diagnostic-intro { position: sticky; top: 30px; }
.diagnostic-intro h2 { color: white; }
.diagnostic-intro > p:not(.section-kicker) { max-width: 410px; line-height: 1.7; }
.question-counter { width: fit-content; display: flex; align-items: center; gap: 12px; margin-top: 30px; padding: 12px 14px; border: 1px solid rgba(255,255,255,.13); border-radius: 12px; background: rgba(255,255,255,.06); }
.question-counter strong { color: white; font-size: 1.25rem; }
.question-counter span { font-size: .72rem; }
.quiz-card { padding: clamp(24px, 4vw, 42px); border: 1px solid rgba(255,255,255,.15); border-radius: 30px; color: var(--text); background: white; box-shadow: 0 28px 80px rgba(0,29,38,.2); }
.quiz-question { margin: 0; padding: 0 0 28px; border: 0; }
.quiz-question + .quiz-question { padding-top: 30px; border-top: 1px solid var(--line); }
.quiz-question legend { width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 0; color: var(--navy); font-weight: 700; line-height: 1.45; }
.quiz-question legend span { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 8px; color: var(--teal); background: #eaf6f5; font-size: .65rem; }
.quiz-options { display: grid; gap: 8px; margin-top: 16px; }
.quiz-options button { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 46px; padding: 10px 13px; color: var(--text); text-align: left; border: 1px solid var(--line); border-radius: 12px; background: #fbfdfe; font-size: .84rem; transition: 160ms ease; }
.quiz-options button:hover { border-color: rgba(0,123,133,.45); }
.quiz-options button > span { width: 26px; height: 26px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 7px; color: var(--muted); background: #edf2f5; font-size: .66rem; font-weight: 800; }
.quiz-options button.selected { color: var(--teal-dark); border-color: var(--teal); background: #eef9f8; }
.quiz-options button.selected > span { color: white; background: var(--teal); }
.quiz-options button.correct { color: #416f26; border-color: var(--green); background: #f1f8ed; }
.quiz-options button.correct > span { color: white; background: var(--green); }
.quiz-options button.incorrect { color: #9e3f3f; border-color: #d97d7d; background: #fff3f3; }
.quiz-options button.incorrect > span { color: white; background: #be5757; }
.quiz-feedback { margin: 12px 0 0 40px; padding: 11px 13px; border-left: 3px solid var(--teal); color: #4a6378; background: #f3f8fa; font-size: .78rem; line-height: 1.55; }
.quiz-submit { width: 100%; border: 0; }
.quiz-submit:disabled { cursor: not-allowed; opacity: .45; transform: none; box-shadow: none; }
.result-card { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 18px; padding: 20px; border-radius: 18px; color: #345069; background: #eef8f1; }
.result-card > span { color: var(--muted); font-size: .68rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
.result-card > strong { color: var(--green); font-size: 2.2rem; }
.result-card h3 { margin: 0; color: var(--navy); font-size: .95rem; }
.result-card p { margin: 4px 0 0; line-height: 1.45; font-size: .76rem; }
.result-card button { padding: 8px 10px; color: var(--teal); border: 1px solid rgba(0,123,133,.2); border-radius: 9px; background: white; font-size: .7rem; font-weight: 700; }

.layers-section { padding-block: 110px; background: white; }
.center-heading { max-width: 760px; margin: 0 auto; text-align: center; }
.center-heading > p:last-child { max-width: 610px; margin: 18px auto 0; line-height: 1.65; }
.layers-list { max-width: 920px; margin: 52px auto 0; border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
.layers-list article { display: grid; grid-template-columns: 56px 1fr; gap: 18px; padding: 20px 24px; background: white; transition: 160ms ease; }
.layers-list article + article { border-top: 1px solid var(--line); }
.layers-list article:hover { background: #f5fafb; }
.layers-list article > span { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; color: var(--teal); background: rgba(0,123,133,.09); font-size: .68rem; font-weight: 800; }
.layers-list strong { color: var(--navy); font-size: .95rem; }
.layers-list p { margin: 4px 0 0; line-height: 1.5; font-size: .82rem; }
.anti-patterns { max-width: 920px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px auto 0; }
.anti-patterns div { display: grid; grid-template-columns: 40px 1fr; column-gap: 13px; padding: 20px; border-radius: 17px; background: #fff4f3; }
.anti-patterns div:last-child { background: #f0f8ed; }
.anti-patterns span { grid-row: 1 / 3; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; color: white; background: #c95b52; font-weight: 800; }
.anti-patterns div:last-child span { background: var(--green); }
.anti-patterns strong { color: var(--navy); font-size: .86rem; }
.anti-patterns p { margin: 4px 0 0; line-height: 1.45; font-size: .76rem; }

.route-section { padding-block: 110px; color: rgba(255,255,255,.72); background: radial-gradient(circle at 90% 10%, rgba(0,123,133,.24), transparent 25%), var(--navy-2); }
.route-heading h2 { color: white; }
.route-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 48px; }
.route-tabs button { min-height: 118px; padding: 16px; color: rgba(255,255,255,.62); text-align: left; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; background: rgba(255,255,255,.035); transition: 160ms ease; }
.route-tabs button span, .route-tabs button strong, .route-tabs button small { display: block; }
.route-tabs button span { color: #69d3ca; font-size: .61rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
.route-tabs button strong { margin-top: 7px; color: white; font-size: .88rem; }
.route-tabs button small { margin-top: 5px; font-size: .7rem; }
.route-tabs button.active { border-color: #69d3ca; background: rgba(0,123,133,.22); box-shadow: inset 0 0 0 1px rgba(105,211,202,.12); }
.module-detail { margin-top: 14px; padding: clamp(26px, 4vw, 44px); border: 1px solid rgba(255,255,255,.12); border-radius: 24px; background: rgba(255,255,255,.065); }
.module-topline { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.module-topline span { color: #69d3ca; font-size: .67rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.module-topline h3 { margin: 4px 0 0; color: white; font-size: 1.65rem; }
.module-topline > strong { padding: 9px 12px; color: white; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; background: rgba(255,255,255,.06); font-size: .75rem; }
.module-focus { max-width: 750px; margin: 22px 0 0; color: white; line-height: 1.65; }

          <h2>Cinco principios para no perder el rumbo</h2>
          <div className="principles-grid">
            <article><span>01</span><strong>El trabajo real primero</strong><p>La visita, la observación y la voz de quienes ejecutan la tarea preceden a una medición representativa.</p></article>
            <article><span>02</span><strong>Medir no es evaluar</strong><p>El dato necesita estrategia, calidad, contexto, criterio de comparación e interpretación.</p></article>
            <article><span>03</span><strong>El límite no divide magia</strong><p>La incertidumbre, susceptibilidad, mezclas y variabilidad impiden tratarlo como frontera absoluta entre sano y enfermo.</p></article>
            <article><span>04</span><strong>Controlar antes que proteger</strong><p>La prioridad es actuar sobre la fuente y el medio; el EPP no debe ocultar oportunidades de eliminación e ingeniería.</p></article>
            <article><span>05</span><strong>Verificar cierra el ciclo</strong><p>Un control sin comprobación, mantenimiento y participación puede existir en papel y fallar en el trabajo.</p></article>
